<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SKYWATCH — Aerospace Intelligence Platform</title>
  <!-- Fallback theme script to eagerly apply initial theme -->
  <script>
    (function () {
      try {
        const theme = localStorage.getItem('skywatch-theme') || 'system';
        const isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) document.documentElement.classList.add('dark');
      } catch (e) { }
    })();
  </script>
  <script async src="https://maps.googleapis.com/maps/api/js?key=%VITE_GOOGLE_MAPS_API_KEY%"></script>
  <meta name="description"
    content="Real-time 3D aerospace tracking. Monitor aircraft, satellites, and rockets on an interactive globe with AI-powered insights." />
  <meta name="author" content="SKYWATCH" />
  <meta name="theme-color" content="#020810" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <meta property="og:title" content="SKYWATCH — Aerospace Intelligence Platform" />
  <meta property="og:description"
    content="Real-time 3D aerospace tracking. Monitor aircraft, satellites, and rockets on an interactive globe with AI-powered insights." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/og-image.png" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@SKYWATCH" />
  <meta name="twitter:image" content="/og-image.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
